 UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="59" dy="0">a cada minuto</tspan></text><text x="277" y="39" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" font-weight="600" fill="#ff8fa2">2</text><text x="303" y="38" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#97b2b5"><tspan x="303" dy="0">entra na fila</tspan></text><rect x="277" y="55" width="175" height="219" rx="16" fill="#163843" stroke="#2c4b55" stroke-width="1.2" stroke-dasharray="2 5" stroke-linecap="round"/><text x="289" y="73" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#97b2b5">a cada 5 segundos</text><rect x="291" y="85" width="151" height="87" rx="12" fill="#2c4b55"/><rect x="287" y="81" width="151" height="87" rx="12" fill="#112a33" stroke="#2c4b55" stroke-width="1.4"/><text x="300" y="108" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="300" dy="0">Coletor</tspan></text><text x="300" y="132" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#97b2b5"><tspan x="300" dy="0">preço e</tspan><tspan x="300" dy="19">indicadores</tspan></text><path d="M287 185a75.5 7 0 0 1 151 0v68a75.5 7 0 0 1 -151 0Z" transform="translate(4 4)" fill="#2c4b55"/><path d="M287 185a75.5 7 0 0 1 151 0v68a75.5 7 0 0 1 -151 0Z" fill="#112a33" stroke="#2c4b55" stroke-width="1.4"/><path d="M287 185a75.5 7 0 0 0 151 0" fill="none" stroke="#2c4b55" stroke-width="1.4"/><text x="300" y="219" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="650" fill="#e3eeec"><tspan x="300" dy="0">Redis Streams</tspan></text><text x="300" y="243" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe U