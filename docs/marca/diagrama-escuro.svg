<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="100%" role="img" aria-labelledby="escuro-nexus-quant-largo-t escuro-nexus-quant-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="escuro-nexus-quant-largo-t">Bot de trading que confere tudo com a corretora</title><desc id="escuro-nexus-quant-largo-d">A corretora, hoje em simulação, manda o preço; um coletor publica cada leitura numa fila Redis Streams; o cérebro ativo decide enquanto um cérebro em teste decide em paralelo sem operar; guardas de risco filtram a decisão; e a ordem volta à corretora com identificador único, para que um reinício nunca duplique ordem. Uma reconciliação compara a corretora com o banco a cada minuto e a corretora sempre vence. Cada decisão vira evento, que alimenta o painel e os alertas.</desc><defs><marker id="escuro-nexus-quant-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#6cc6d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="escuro-nexus-quant-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#ff7a90" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#0b1e25"/><g aria-hidden="true"><path d="M770 486C770 402 848 372 902 378C962 384 1010 432 1010 486" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M808.4 486C808.4 428.88 861.44 408.48 898.16 412.56C938.96 416.64 971.6 449.28 971.6 486" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M844.4 486C844.4 454.08 874.04 442.68 894.56 444.96C917.36 447.24 935.6 465.48 935.6 486" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><text x="884" y="472" font-family="'Brygada 1918',